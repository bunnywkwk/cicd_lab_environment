---
# k3s: 1 server + 2 agents, Argo CD on the server.
# No token needed: the server generates one and the agents read it from the server.
# private_ip (AWS) when set, else ansible_host (KVM): the hosts reach each other on the private network.
k3s_server_url: "https://{{ hostvars[groups['k3s_server'][0]]['private_ip'] | default(hostvars[groups['k3s_server'][0]]['ansible_host']) }}:6443"
k3s_insecure_registries:
  - "{{ hostvars[groups['ci'][0]]['private_ip'] | default(hostvars[groups['ci'][0]]['ansible_host']) }}:{{ hostvars[groups['ci'][0]]['registry_port'] }}"   # the lab registry on the CI host, plain HTTP
